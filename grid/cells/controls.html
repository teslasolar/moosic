<div class="ctrl-row">
  <button id="prevBtn" class="ctrl-btn">⏮️</button>
  <button id="playBtn" class="ctrl-btn play-btn">▶️</button>
  <button id="nextBtn" class="ctrl-btn">⏭️</button>
  <button id="shuffleBtn" class="ctrl-btn">🔀</button>
  <button id="repeatBtn" class="ctrl-btn">🔁</button>
</div>
<div class="progress-row">
  <span id="currentTime">0:00</span>
  <input type="range" id="progressBar" value="0" min="0" max="100" style="flex:1">
  <span id="duration">0:00</span>
</div>
