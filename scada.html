<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>⚙ SCADA · tag.db control</title>
<style>
:root{--bg:#050810;--c:#0a0d15;--b:#161d2a;--t:#8898b4;--t2:#3a4860;--ig:#38b5f9;--ok:#42e898;--er:#ff4466;--wr:#f0a030;--gd:#d4a94a}
*{margin:0;box-sizing:border-box;font-family:'Courier New',monospace}
body{background:var(--bg);color:var(--t);height:100vh;overflow:hidden;display:grid;grid-template:36px 1fr 24px/260px 1fr;gap:1px}
.hdr{grid-column:1/-1;background:var(--c);display:flex;align-items:center;padding:0 12px;gap:10px;font-size:10px;border-bottom:1px solid var(--b)}
.side{background:var(--c);overflow-y:auto;padding:6px;font-size:8px;scrollbar-width:thin}
.main{background:var(--bg);overflow-y:auto;padding:8px;scrollbar-width:thin}
.ftr{grid-column:1/-1;background:#030508;border-top:1px solid var(--b);display:flex;align-items:center;padding:0 12px;gap:8px;font-size:7px;color:var(--t2)}
.tag-row{display:flex;gap:6px;padding:4px 6px;border-bottom:1px solid var(--b);cursor:pointer;align-items:center}
.tag-row:hover{background:rgba(56,181,249,.04)}
.tag-row.sel{background:rgba(56,181,249,.08);border-left:2px solid var(--ig)}
.pill{padding:1px 4px;border-radius:2px;font-size:6px;font-weight:600;letter-spacing:.3px}
.sys{background:rgba(66,232,152,.1);color:var(--ok)}
.cell{background:rgba(56,181,249,.1);color:var(--ig)}
.scr{background:rgba(240,160,48,.1);color:var(--wr)}
.poll{background:rgba(170,68,255,.1);color:#a080ff}
.stat{background:var(--c);border:1px solid var(--b);border-radius:3px;padding:6px 10px;text-align:center}
.stat .v{font-size:18px;font-weight:700;color:var(--ig)}
.stat .l{font-size:7px;color:var(--t2);margin-top:2px}
.detail{background:var(--c);border:1px solid var(--b);border-radius:3px;padding:8px;margin-top:8px;font-size:8px}
.detail pre{background:var(--bg);padding:6px;border-radius:2px;overflow-x:auto;font-size:7px;line-height:1.5;color:var(--gd);margin-top:4px;white-space:pre-wrap}
.detail h3{font-size:9px;color:var(--ig);margin-bottom:4px}
.props{display:grid;grid-template-columns:80px 1fr;gap:2px 8px;font-size:7px;margin-top:4px}
.props .k{color:var(--t2);text-align:right}.props .val{color:var(--ok);word-break:break-all}
.btn{background:var(--b);border:1px solid var(--t2);color:var(--t);padding:3px 8px;border-radius:3px;font-size:7px;cursor:pointer;font-family:inherit}
.btn:hover{border-color:var(--ig);color:var(--ig)}
.stats-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:6px;margin-bottom:10px}
#status{color:var(--ok)}
.err{color:var(--er)}
</style>
</head>
<body>
<div class="hdr">
  <span style="color:var(--gd);font-weight:700;font-size:12px">⚙ SCADA</span>
  <span style="color:var(--b)">│</span>
  <span>tag.db control · teslasolar/moosic</span>
  <span style="flex:1"></span>
  <span id="status">connecting...</span>
  <button class="btn" onclick="refresh()">↻ refresh</button>
  <button class="btn" onclick="copyAll()">⎘ export</button>
  <span style="color:var(--b)">│</span>
  <a href="grid/" style="color:var(--ig);text-decoration:none;font-size:8px">→ grid</a>
</div>

<div class="side" id="sidebar"></div>
<div class="main" id="main"></div>

<div class="ftr">
  <span>🏷 GitHub Issues as tag.db</span>
  <span style="flex:1"></span>
  <span id="clock"></span>
</div>

<script src="scada/fetch.js"></script>
<script src="scada/render.js"></script>
<script src="scada/detail.js"></script>
</body></html>
